<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>台股模擬操盤儀表板</title>
<style>
  :root {
    --bg: #0f1117;
    --card: #1a1d27;
    --border: #2a2d3a;
    --text: #e2e8f0;
    --muted: #718096;
    --green: #48bb78;
    --red: #fc8181;
    --blue: #63b3ed;
    --gold: #f6c90e;
    --radius: 12px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: -apple-system, 'Segoe UI', sans-serif; min-height: 100vh; }

  header {
    background: var(--card);
    border-bottom: 1px solid var(--border);
    padding: 16px 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  header h1 { font-size: 18px; font-weight: 600; color: var(--gold); letter-spacing: 0.5px; }
  .last-updated { font-size: 12px; color: var(--muted); }
  .refresh-btn {
    background: var(--border);
    border: none;
    color: var(--text);
    padding: 6px 14px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
  }
  .refresh-btn:hover { background: #3a3d4a; }

  main { max-width: 1100px; margin: 0 auto; padding: 24px 20px; }

  .stats-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 14px;
    margin-bottom: 24px;
  }
  .stat-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px 20px;
  }
  .stat-label { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); margin-bottom: 8px; }
  .stat-value { font-size: 22px; font-weight: 700; }
  .stat-sub { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .green { color: var(--green); }
  .red { color: var(--red); }
  .blue { color: var(--blue); }
  .gold { color: var(--gold); }

  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 24px; }
  @media (max-width: 700px) { .grid-2 { grid-template-columns: 1fr; } }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
  }
  .card-header {
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    font-size: 13px;
    font-weight: 600;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.8px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .card-body { padding: 18px 20px; }

  .holding-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
  }
  .holding-row:last-child { border-bottom: none; }
  .holding-code { font-weight: 700; font-size: 15px; }
  .holding-name { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .holding-right { text-align: right; }
  .holding-value { font-size: 14px; font-weight: 600; }
  .holding-pnl { font-size: 12px; margin-top: 3px; }

  .futures-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .fut-item { }
  .fut-key { font-size: 11px; color: var(--muted); margin-bottom: 4px; }
  .fut-val { font-size: 15px; font-weight: 600; }

  .position-badge {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 700;
  }
  .badge-short { background: rgba(252,129,129,0.15); color: var(--red); border: 1px solid rgba(252,129,129,0.3); }
  .badge-long  { background: rgba(72,187,120,0.15);  color: var(--green); border: 1px solid rgba(72,187,120,0.3); }
  .badge-none  { background: rgba(113,128,150,0.15); color: var(--muted); border: 1px solid rgba(113,128,150,0.3); }

  .log-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .log-table th { text-align: left; padding: 8px 12px; color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.8px; border-bottom: 1px solid var(--border); }
  .log-table td { padding: 10px 12px; border-bottom: 1px solid rgba(42,45,58,0.6); }
  .log-table tr:last-child td { border-bottom: none; }
  .log-table tr:hover td { background: rgba(255,255,255,0.02); }
  .action-tag {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 4px;
    font-size: 11px;
    font-weight: 600;
  }
  .tag-buy   { background: rgba(72,187,120,0.15);  color: var(--green); }
  .tag-sell  { background: rgba(252,129,129,0.15); color: var(--red); }
  .tag-short { background: rgba(252,129,129,0.15); color: var(--red); }
  .tag-cover { background: rgba(72,187,120,0.15);  color: var(--green); }
  .tag-plan  { background: rgba(99,179,237,0.15);  color: var(--blue); }
  .tag-other { background: rgba(113,128,150,0.15); color: var(--muted); }

  .empty { color: var(--muted); font-size: 13px; text-align: center; padding: 24px; }

  .progress-bar { background: var(--border); border-radius: 4px; height: 6px; margin-top: 8px; overflow: hidden; }
  .progress-fill { height: 100%; border-radius: 4px; transition: width 0.3s; }

  .loading { text-align: center; padding: 60px; color: var(--muted); }
  .error-msg { background: rgba(252,129,129,0.1); border: 1px solid rgba(252,129,129,0.3); color: var(--red); border-radius: 8px; padding: 14px 18px; margin-bottom: 20px; font-size: 13px; }
</style>
</head>
<body>
<header>
  <h1>📊 台股模擬操盤</h1>
  <div style="display:flex;align-items:center;gap:16px">
    <span class="last-updated" id="last-updated">載入中...</span>
    <button class="refresh-btn" onclick="loadData()">↻ 更新</button>
  </div>
</header>

<main id="app">
  <div class="loading">載入資料中...</div>
</main>

<script>
const REPO = 'foreveris524-dev/tw-stock-sim';
const RAW = `https://raw.githubusercontent.com/${REPO}/main`;

function fmt(n) { return Math.abs(n) >= 1000 ? n.toLocaleString('zh-TW', {maximumFractionDigits:0}) : n.toFixed(0); }
function fmtMoney(n) { const s = n >= 0 ? '+' : ''; return s + '$' + fmt(n); }
function colorClass(n) { return n > 0 ? 'green' : n < 0 ? 'red' : ''; }

function actionTag(action) {
  const a = (action || '').toUpperCase();
  if (a.includes('BUY'))   return `<span class="action-tag tag-buy">${action}</span>`;
  if (a.includes('SELL'))  return `<span class="action-tag tag-sell">${action}</span>`;
  if (a.includes('SHORT')) return `<span class="action-tag tag-short">${action}</span>`;
  if (a.includes('COVER')) return `<span class="action-tag tag-cover">${action}</span>`;
  if (a.includes('PLAN'))  return `<span class="action-tag tag-plan">${action}</span>`;
  return `<span class="action-tag tag-other">${action}</span>`;
}

async function loadData() {
  const app = document.getElementById('app');
  try {
    const [pRes, fRes] = await Promise.all([
      fetch(`${RAW}/portfolio.json?t=${Date.now()}`),
      fetch(`${RAW}/futures_portfolio.json?t=${Date.now()}`)
    ]);
    const p = await pRes.json();
    const f = await fRes.json();
    render(p, f);
    document.getElementById('last-updated').textContent = '更新於 ' + new Date().toLocaleTimeString('zh-TW');
  } catch(e) {
    app.innerHTML = `<div class="error-msg">⚠ 資料載入失敗：${e.message}</div>`;
  }
}

function render(p, f) {
  const app = document.getElementById('app');
  const cash = p.cash || 0;
  const totalValue = p.total_value || 0;
  const holdings = p.holdings || [];
  const initCapital = p.initial_capital || 1000000;
  const initMargin = f.initial_margin || 200000;
  const cumPnl = f.cumulative_pnl || 0;
  const usedMargin = f.used_margin || 0;
  const availMargin = f.available_margin || initMargin;
  const position = f.position;
  const stockPnl = totalValue - initCapital;
  const totalPnl = stockPnl + cumPnl;
  const marginPct = initMargin ? (usedMargin / initMargin * 100) : 0;
  const tradeLog = [...(p.trade_log || [])].reverse().slice(0, 20);
  const futLog = [...(f.trade_log || [])].reverse().slice(0, 10);

  // Position badge
  let posBadge = '<span class="position-badge badge-none">無持倉</span>';
  let posDetail = '';
  if (position) {
    const dir = position.direction === 'LONG' ? 'LONG 多' : 'SHORT 空';
    const cls = position.direction === 'LONG' ? 'badge-long' : 'badge-short';
    posBadge = `<span class="position-badge ${cls}">${dir}</span>`;
    const uPnl = position.unrealized_pnl || 0;
    posDetail = `${position.contracts}口 @ ${(position.entry_price||0).toLocaleString()}點`;
    if (uPnl !== 0) posDetail += `　未實現 <span class="${colorClass(uPnl)}">${fmtMoney(uPnl)}</span>`;
  }

  // Holdings HTML
  let holdingsHtml = '<div class="empty">目前無持股</div>';
  if (holdings.length) {
    holdingsHtml = holdings.map(h => {
      const upnl = h.unrealized_pnl || 0;
      const upct = h.unrealized_pnl_pct || 0;
      const pct = totalValue ? (h.value||0)/totalValue*100 : 0;
      return `
      <div class="holding-row">
        <div>
          <div class="holding-code">${h.code} <small style="font-weight:400;color:var(--muted)">${h.name||''}</small></div>
          <div class="holding-name">均價 $${(h.avg_price||0).toFixed(1)} · ${(h.shares||0).toLocaleString()}股 · 佔 ${pct.toFixed(1)}%</div>
        </div>
        <div class="holding-right">
          <div class="holding-value">$${fmt(h.value||0)}</div>
          <div class="holding-pnl ${colorClass(upnl)}">${fmtMoney(upnl)} (${upnl>=0?'+':''}${upct.toFixed(1)}%)</div>
        </div>
      </div>`;
    }).join('');
  }

  // Trade log rows (stocks)
  const logRows = tradeLog.filter(t => !['RESET'].includes(t.action)).map(t => `
    <tr>
      <td>${t.date||''}</td>
      <td>${actionTag(t.action)}</td>
      <td>${t.code||'—'}</td>
      <td>${t.price ? '$'+fmt(t.price) : '—'}</td>
      <td>${t.shares ? (t.shares).toLocaleString() : '—'}</td>
      <td>${t.amount ? '$'+fmt(t.amount) : '—'}</td>
      <td style="color:var(--muted);font-size:12px;max-width:200px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${t.reason||''}</td>
    </tr>`).join('') || '<tr><td colspan="7" class="empty">無記錄</td></tr>';

  // Futures log rows
  const futRows = futLog.filter(t => !['RESET'].includes(t.action)).map(t => {
    const pnl = t.pnl || 0;
    return `
    <tr>
      <td>${t.date||''}</td>
      <td>${actionTag(t.action)}</td>
      <td>${t.direction||'—'}</td>
      <td>${t.contracts||'—'}</td>
      <td>${t.entry_price ? (t.entry_price).toLocaleString() : '—'}</td>
      <td class="${colorClass(pnl)}">${pnl !== 0 ? fmtMoney(pnl) : '—'}</td>
      <td style="color:var(--muted);font-size:12px;max-width:160px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${t.reason||''}</td>
    </tr>`;
  }).join('') || '<tr><td colspan="7" class="empty">無記錄</td></tr>';

  const marginFill = Math.min(marginPct, 100);
  const marginColor = marginPct > 70 ? '#fc8181' : marginPct > 40 ? '#f6c90e' : '#48bb78';

  app.innerHTML = `
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-label">現貨總值</div>
        <div class="stat-value">$${fmt(totalValue)}</div>
        <div class="stat-sub ${colorClass(stockPnl)}">${fmtMoney(stockPnl)} 相較起始</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">可用現金</div>
        <div class="stat-value blue">$${fmt(cash)}</div>
        <div class="stat-sub">${totalValue ? (cash/totalValue*100).toFixed(0) : 0}% 現金比</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">期貨累計損益</div>
        <div class="stat-value ${colorClass(cumPnl)}">${fmtMoney(cumPnl)}</div>
        <div class="stat-sub">保證金 $${fmt(availMargin)}</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">整體損益合計</div>
        <div class="stat-value ${colorClass(totalPnl)}">${fmtMoney(totalPnl)}</div>
        <div class="stat-sub">更新 ${p.last_updated||'—'}</div>
      </div>
    </div>

    <div class="grid-2">
      <div class="card">
        <div class="card-header">現貨持股</div>
        <div class="card-body">${holdingsHtml}</div>
      </div>
      <div class="card">
        <div class="card-header">期貨帳戶 <span>${posBadge}</span></div>
        <div class="card-body">
          ${posDetail ? `<div style="margin-bottom:16px;font-size:14px">${posDetail}</div>` : ''}
          <div class="futures-grid">
            <div class="fut-item">
              <div class="fut-key">商品</div>
              <div class="fut-val">${f.instrument||'小台指 MTX'}</div>
            </div>
            <div class="fut-item">
              <div class="fut-key">點值</div>
              <div class="fut-val">$${f.point_value||50} / 點</div>
            </div>
            <div class="fut-item">
              <div class="fut-key">初始保證金</div>
              <div class="fut-val">$${fmt(initMargin)}</div>
            </div>
            <div class="fut-item">
              <div class="fut-key">已用保證金</div>
              <div class="fut-val ${usedMargin > 0 ? 'gold' : ''}">$${fmt(usedMargin)}</div>
            </div>
          </div>
          <div style="margin-top:16px">
            <div style="display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:4px">
              <span>保證金使用率</span><span>${marginPct.toFixed(0)}%</span>
            </div>
            <div class="progress-bar">
              <div class="progress-fill" style="width:${marginFill}%;background:${marginColor}"></div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="card" style="margin-bottom:20px">
      <div class="card-header">現貨交易記錄（最近 20 筆）</div>
      <div style="overflow-x:auto">
        <table class="log-table">
          <thead><tr><th>日期</th><th>動作</th><th>代號</th><th>價格</th><th>股數</th><th>金額</th><th>備註</th></tr></thead>
          <tbody>${logRows}</tbody>
        </table>
      </div>
    </div>

    <div class="card">
      <div class="card-header">期貨操作記錄（最近 10 筆）</div>
      <div style="overflow-x:auto">
        <table class="log-table">
          <thead><tr><th>日期</th><th>動作</th><th>方向</th><th>口數</th><th>進場點</th><th>損益</th><th>備註</th></tr></thead>
          <tbody>${futRows}</tbody>
        </table>
      </div>
    </div>
  `;
}

loadData();
setInterval(loadData, 60000); // 每 60 秒自動更新
</script>
</body>
</html>
