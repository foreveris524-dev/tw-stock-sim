<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>台股模擬操盤儀表板</title>
<style>
  :root {
    --bg: #0f1117;
    --card: #1a1d27;
    --border: #2a2d3a;
    --text: #e2e8f0;
    --muted: #718096;
    --green: #48bb78;
    --red: #fc8181;
    --blue: #63b3ed;
    --gold: #f6c90e;
    --radius: 12px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: -apple-system, 'Segoe UI', sans-serif; min-height: 100vh; }

  header {
    background: var(--card);
    border-bottom: 1px solid var(--border);
    padding: 16px 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  header h1 { font-size: 18px; font-weight: 600; color: var(--gold); letter-spacing: 0.5px; }
  .last-updated { font-size: 12px; color: var(--muted); }
  .refresh-btn {
    background: var(--border);
    border: none;
    color: var(--text);
    padding: 6px 14px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
  }
  .refresh-btn:hover { background: #3a3d4a; }

  .outer { max-width: 1100px; margin: 0 auto; padding: 24px 20px; }

  /* ── Charts ── */
  .charts-tabs { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
  .tab-btn {
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 7px 18px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 500;
    transition: all 0.15s;
  }
  .tab-btn.active { background: var(--border); color: var(--text); border-color: #4a4d5a; }
  .tab-btn:hover:not(.active) { color: var(--text); }
  .chart-panel { display: none; }
  .chart-panel.active { display: block; }
  .chart-wrap {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    height: 420px;
    margin-bottom: 24px;
  }
  .chart-wrap iframe { width: 100%; height: 100%; border: none; display: block; }
  .watchlist-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 14px;
    margin-bottom: 24px;
  }
  .mini-label { font-size: 11px; color: var(--muted); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.8px; }
  .mini-chart-wrap {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    height: 140px;
  }
  .mini-chart-wrap iframe { width: 100%; height: 100%; border: none; display: block; }

  /* ── Stats ── */
  .stats-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 14px;
    margin-bottom: 24px;
  }
  .stat-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px 20px;
  }
  .stat-label { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); margin-bottom: 8px; }
  .stat-value { font-size: 22px; font-weight: 700; }
  .stat-sub { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .green { color: var(--green); }
  .red { color: var(--red); }
  .blue { color: var(--blue); }
  .gold { color: var(--gold); }

  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 24px; }
  @media (max-width: 700px) { .grid-2 { grid-template-columns: 1fr; } }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
  }
  .card-header {
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    font-size: 13px;
    font-weight: 600;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.8px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .card-body { padding: 18px 20px; }

  .holding-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
  }
  .holding-row:last-child { border-bottom: none; }
  .holding-code { font-weight: 700; font-size: 15px; }
  .holding-name { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .holding-right { text-align: right; }
  .holding-value { font-size: 14px; font-weight: 600; }
  .holding-pnl { font-size: 12px; margin-top: 3px; }

  .futures-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .fut-key { font-size: 11px; color: var(--muted); margin-bottom: 4px; }
  .fut-val { font-size: 15px; font-weight: 600; }

  .position-badge {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 700;
  }
  .badge-short { background: rgba(252,129,129,0.15); color: var(--red); border: 1px solid rgba(252,129,129,0.3); }
  .badge-long  { background: rgba(72,187,120,0.15);  color: var(--green); border: 1px solid rgba(72,187,120,0.3); }
  .badge-none  { background: rgba(113,128,150,0.15); color: var(--muted); border: 1px solid rgba(113,128,150,0.3); }

  .log-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .log-table th { text-align: left; padding: 8px 12px; color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.8px; border-bottom: 1px solid var(--border); }
  .log-table td { padding: 10px 12px; border-bottom: 1px solid rgba(42,45,58,0.6); }
  .log-table tr:last-child td { border-bottom: none; }
  .log-table tr:hover td { background: rgba(255,255,255,0.02); }

  .action-tag { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; }
  .tag-buy   { background: rgba(72,187,120,0.15);  color: var(--green); }
  .tag-sell  { background: rgba(252,129,129,0.15); color: var(--red); }
  .tag-short { background: rgba(252,129,129,0.15); color: var(--red); }
  .tag-cover { background: rgba(72,187,120,0.15);  color: var(--green); }
  .tag-plan  { background: rgba(99,179,237,0.15);  color: var(--blue); }
  .tag-other { background: rgba(113,128,150,0.15); color: var(--muted); }
  .session-day   { display: inline-block; padding: 1px 5px; border-radius: 3px; font-size: 10px; font-weight: 600; background: rgba(99,179,237,0.15); color: var(--blue); margin-left: 4px; vertical-align: middle; }
  .session-night { display: inline-block; padding: 1px 5px; border-radius: 3px; font-size: 10px; font-weight: 600; background: rgba(159,122,234,0.2); color: #b794f4; margin-left: 4px; vertical-align: middle; }

  .stock-charts-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
    margin-bottom: 8px;
  }
  @media (max-width: 640px) { .stock-charts-grid { grid-template-columns: 1fr; } }
  .stock-chart-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    padding: 10px 12px 6px;
  }
  .stock-chart-inner { height: 160px; width: 100%; }
  .empty { color: var(--muted); font-size: 13px; text-align: center; padding: 24px; }
  .progress-bar { background: var(--border); border-radius: 4px; height: 6px; margin-top: 8px; overflow: hidden; }
  .progress-fill { height: 100%; border-radius: 4px; transition: width 0.3s; }
  .loading { text-align: center; padding: 60px; color: var(--muted); }
  .card-mb { margin-bottom: 20px; }

  /* ── Watchlist ── */
  .screen-meta { font-size: 12px; color: var(--muted); margin-bottom: 16px; display: flex; gap: 20px; flex-wrap: wrap; }
  .screen-meta span { background: var(--border); padding: 4px 10px; border-radius: 6px; }
  .wl-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .wl-table th { text-align: left; padding: 8px 10px; color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.8px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  .wl-table td { padding: 10px 10px; border-bottom: 1px solid rgba(42,45,58,0.6); vertical-align: middle; }
  .wl-table tr:hover td { background: rgba(255,255,255,0.02); }
  .score-bar { display: flex; align-items: center; gap: 8px; }
  .score-fill { height: 6px; border-radius: 3px; min-width: 4px; }
  .score-num { font-weight: 700; font-size: 14px; min-width: 28px; }
  .signal-tag { display: inline-block; background: rgba(99,179,237,0.12); color: var(--blue); border: 1px solid rgba(99,179,237,0.25); padding: 2px 7px; border-radius: 4px; font-size: 11px; margin: 1px; white-space: nowrap; }
  .rank-badge { display: inline-block; width: 24px; height: 24px; border-radius: 50%; background: var(--border); font-size: 11px; font-weight: 700; text-align: center; line-height: 24px; }
  .rank-1 { background: #b7791f; color: #fff; }
  .rank-2 { background: #718096; color: #fff; }
  .rank-3 { background: #744210; color: #fff; }
</style>
<script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
</head>
<body>

<header>
  <h1>📊 台股模擬操盤</h1>
  <div style="display:flex;align-items:center;gap:16px">
    <span class="last-updated" id="last-updated">載入中...</span>
    <button class="refresh-btn" onclick="loadData()">↻ 更新</button>
  </div>
</header>

<div class="outer">

  <!-- 走勢圖 -->
  <div class="charts-tabs">
    <button class="tab-btn active" onclick="switchTab(this,'taiex')">台灣加權指數</button>
    <button class="tab-btn" onclick="switchTab(this,'futures')">台指期（近月）</button>
    <button class="tab-btn" onclick="switchTab(this,'stocks')">個股走勢</button>
  </div>

  <div id="tab-taiex" class="chart-panel active">
    <div class="chart-wrap">
      <div class="tradingview-widget-container" style="height:100%;width:100%">
        <div class="tradingview-widget-container__widget" style="height:100%;width:100%"></div>
        <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-advanced-chart.js" async>
        {"autosize":true,"symbol":"INDEX:TAIEX","interval":"D","timezone":"Asia/Taipei","theme":"dark","style":"1","locale":"zh_TW","allow_symbol_change":false,"save_image":false,"hide_side_toolbar":false,"hide_top_toolbar":false,"support_host":"https://www.tradingview.com"}
        </script>
      </div>
    </div>
  </div>

  <div id="tab-futures" class="chart-panel">
    <div style="font-size:12px;color:var(--muted);margin-bottom:10px">
      ⓘ 顯示 TAIFEX:TXF1!（台灣指數 CFD），走勢與台指期高度吻合，因 TAIFEX 原始合約不支援免費嵌入。
    </div>
    <div class="chart-wrap">
      <div class="tradingview-widget-container" style="height:100%;width:100%">
        <div class="tradingview-widget-container__widget" style="height:100%;width:100%"></div>
        <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-advanced-chart.js" async>
        {"autosize":true,"symbol":"INDEX:TAIEX","interval":"D","timezone":"Asia/Taipei","theme":"dark","style":"1","locale":"zh_TW","allow_symbol_change":false,"save_image":false,"hide_side_toolbar":false,"hide_top_toolbar":false,"support_host":"https://www.tradingview.com"}
        </script>
      </div>
    </div>
  </div>

  <div id="tab-stocks" class="chart-panel">
    <div class="stock-charts-grid">
      <div class="stock-chart-card">
        <div class="mini-label">0050 元大台灣50</div>
        <div class="stock-chart-inner" id="chart-0050"></div>
      </div>
      <div class="stock-chart-card">
        <div class="mini-label">2330 台積電</div>
        <div class="stock-chart-inner" id="chart-2330"></div>
      </div>
      <div class="stock-chart-card">
        <div class="mini-label">00981A 統一主動台股增長</div>
        <div class="stock-chart-inner" id="chart-00981A"></div>
      </div>
      <div class="stock-chart-card">
        <div class="mini-label">TAIEX 台灣加權指數</div>
        <div class="stock-chart-inner" id="chart-taiex"></div>
      </div>
    </div>
  </div>

  <!-- 帳戶數據 -->
  <div id="app"><div class="loading">載入資料中...</div></div>

  <!-- 選股雷達 -->
  <div id="watchlist-section" style="margin-top:8px">
    <div class="card">
      <div class="card-header">
        🎯 選股雷達
        <span id="screen-date" style="font-size:11px;font-weight:400"></span>
      </div>
      <div class="card-body" id="watchlist-body">
        <div class="loading">載入選股資料...</div>
      </div>
    </div>
  </div>

  <!-- Binance Bot -->
  <div id="binance-section" style="margin-top:8px">
    <div class="card">
      <div class="card-header">
        ₿ Binance Bot（Testnet）
        <span id="binance-updated" style="font-size:11px;font-weight:400;color:var(--muted)"></span>
      </div>
      <div class="card-body" id="binance-body">
        <div class="loading">載入 Binance 資料...</div>
      </div>
    </div>
  </div>

</div>

<script>
const REPO = 'foreveris524-dev/tw-stock-sim';
const RAW = `https://raw.githubusercontent.com/${REPO}/main`;

function fmt(n) { return Number(n).toLocaleString('zh-TW', {maximumFractionDigits:0}); }
function fmtMoney(n) { return (n >= 0 ? '+' : '') + '$' + fmt(n); }
function colorClass(n) { return n > 0 ? 'green' : n < 0 ? 'red' : ''; }
function actionTag(a) {
  a = a || '';
  const u = a.toUpperCase();
  if (u.includes('BUY'))   return `<span class="action-tag tag-buy">${a}</span>`;
  if (u.includes('SELL'))  return `<span class="action-tag tag-sell">${a}</span>`;
  if (u.includes('SHORT')) return `<span class="action-tag tag-short">${a}</span>`;
  if (u.includes('COVER')) return `<span class="action-tag tag-cover">${a}</span>`;
  if (u.includes('PLAN'))  return `<span class="action-tag tag-plan">${a}</span>`;
  return `<span class="action-tag tag-other">${a}</span>`;
}

async function loadData() {
  try {
    const [pRes, fRes] = await Promise.all([
      fetch(`${RAW}/portfolio.json?t=${Date.now()}`),
      fetch(`${RAW}/futures_portfolio.json?t=${Date.now()}`)
    ]);
    render(await pRes.json(), await fRes.json());
    document.getElementById('last-updated').textContent = '更新於 ' + new Date().toLocaleTimeString('zh-TW');
  } catch(e) {
    document.getElementById('app').innerHTML = `<div style="color:var(--red);padding:20px">⚠ 載入失敗：${e.message}</div>`;
  }
}

function render(p, f) {
  const cash = p.cash || 0, tv = p.total_value || 0, ic = p.initial_capital || 1000000;
  const holdings = p.holdings || [];
  const im = f.initial_margin || 200000, cp = f.cumulative_pnl || 0;
  const um = f.used_margin || 0, am = f.available_margin || im;
  const pos = f.position, spnl = tv - ic, tpnl = spnl + cp;
  const mpct = im ? um / im * 100 : 0;
  const tradeLog = [...(p.trade_log||[])].reverse().slice(0,20);
  const futLog   = [...(f.trade_log||[])].reverse().slice(0,10);

  let posBadge = '<span class="position-badge badge-none">無持倉</span>';
  let posDetail = '';
  if (pos) {
    const isLong = pos.direction === 'LONG';
    posBadge = `<span class="position-badge ${isLong?'badge-long':'badge-short'}">${isLong?'LONG 多':'SHORT 空'}</span>`;
    const up = pos.unrealized_pnl || 0;
    posDetail = `${pos.contracts}口 @ ${(pos.entry_price||0).toLocaleString()}點`;
    if (up) posDetail += `　未實現 <span class="${colorClass(up)}">${fmtMoney(up)}</span>`;
  }

  const holdHtml = holdings.length ? holdings.map(h => {
    const pct = tv ? (h.value||0)/tv*100 : 0, up = h.unrealized_pnl||0, uc = h.unrealized_pnl_pct||0;
    return `<div class="holding-row">
      <div><div class="holding-code">${h.code} <small style="font-weight:400;color:var(--muted)">${h.name||''}</small></div>
      <div class="holding-name">均價$${(h.avg_price||0).toFixed(1)} · ${(h.shares||0).toLocaleString()}股 · ${pct.toFixed(1)}%</div></div>
      <div class="holding-right"><div class="holding-value">$${fmt(h.value||0)}</div>
      <div class="holding-pnl ${colorClass(up)}">${fmtMoney(up)} (${up>=0?'+':''}${uc.toFixed(1)}%)</div></div>
    </div>`;
  }).join('') : '<div class="empty">目前無持股</div>';

  const logRows = tradeLog.filter(t => t.action !== 'RESET').map(t =>
    `<tr><td>${t.date||''}</td><td>${actionTag(t.action)}</td><td>${t.code||'—'}</td>
    <td>${t.price?'$'+fmt(t.price):'—'}</td><td>${t.shares?fmt(t.shares):'—'}</td>
    <td>${t.amount?'$'+fmt(t.amount):'—'}</td>
    <td style="color:var(--muted);font-size:12px;max-width:180px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis">${t.reason||''}</td></tr>`
  ).join('') || '<tr><td colspan="7" class="empty">無記錄</td></tr>';

  const futRows = futLog.filter(t => t.action !== 'RESET').map(t => {
    const pnl = t.pnl || 0;
    const sessionBadge = t.session === 'night'
      ? '<span class="session-night">夜盤</span>'
      : '<span class="session-day">日盤</span>';
    return `<tr><td>${t.date||''}${sessionBadge}</td><td>${actionTag(t.action)}</td><td>${t.direction||'—'}</td>
    <td>${t.contracts||'—'}</td><td>${t.entry_price?(t.entry_price).toLocaleString():'—'}</td>
    <td class="${colorClass(pnl)}">${pnl?fmtMoney(pnl):'—'}</td>
    <td style="color:var(--muted);font-size:12px;max-width:160px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis">${t.reason||''}</td></tr>`;
  }).join('') || '<tr><td colspan="7" class="empty">無記錄</td></tr>';

  const mColor = mpct > 70 ? '#fc8181' : mpct > 40 ? '#f6c90e' : '#48bb78';

  document.getElementById('app').innerHTML = `
    <div class="stats-grid">
      <div class="stat-card"><div class="stat-label">現貨總值</div>
        <div class="stat-value">$${fmt(tv)}</div><div class="stat-sub ${colorClass(spnl)}">${fmtMoney(spnl)} 相較起始</div></div>
      <div class="stat-card"><div class="stat-label">可用現金</div>
        <div class="stat-value blue">$${fmt(cash)}</div><div class="stat-sub">${tv?(cash/tv*100).toFixed(0):0}% 現金比</div></div>
      <div class="stat-card"><div class="stat-label">期貨累計損益</div>
        <div class="stat-value ${colorClass(cp)}">${fmtMoney(cp)}</div><div class="stat-sub">保證金 $${fmt(am)}</div></div>
      <div class="stat-card"><div class="stat-label">整體損益合計</div>
        <div class="stat-value ${colorClass(tpnl)}">${fmtMoney(tpnl)}</div><div class="stat-sub">更新 ${p.last_updated||'—'}</div></div>
    </div>

    <div class="grid-2">
      <div class="card"><div class="card-header">現貨持股</div><div class="card-body">${holdHtml}</div></div>
      <div class="card"><div class="card-header">期貨帳戶 <span>${posBadge}</span></div>
        <div class="card-body">
          ${posDetail?`<div style="margin-bottom:16px;font-size:14px">${posDetail}</div>`:''}
          <div class="futures-grid">
            <div><div class="fut-key">商品</div><div class="fut-val">${f.instrument||'小台指 MTX'}</div></div>
            <div><div class="fut-key">點值</div><div class="fut-val">$${f.point_value||50}/點</div></div>
            <div><div class="fut-key">初始保證金</div><div class="fut-val">$${fmt(im)}</div></div>
            <div><div class="fut-key">已用保證金</div><div class="fut-val ${um?'gold':''}">$${fmt(um)}</div></div>
          </div>
          <div style="margin-top:16px">
            <div style="display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:4px">
              <span>保證金使用率</span><span>${mpct.toFixed(0)}%</span></div>
            <div class="progress-bar"><div class="progress-fill" style="width:${Math.min(mpct,100)}%;background:${mColor}"></div></div>
          </div>
        </div>
      </div>
    </div>

    <div class="card card-mb">
      <div class="card-header">現貨交易記錄（最近 20 筆）</div>
      <div style="overflow-x:auto">
        <table class="log-table">
          <thead><tr><th>日期</th><th>動作</th><th>代號</th><th>價格</th><th>股數</th><th>金額</th><th>備註</th></tr></thead>
          <tbody>${logRows}</tbody>
        </table>
      </div>
    </div>

    <div class="card">
      <div class="card-header">期貨操作記錄（最近 10 筆）</div>
      <div style="overflow-x:auto">
        <table class="log-table">
          <thead><tr><th>日期</th><th>動作</th><th>方向</th><th>口數</th><th>進場點</th><th>損益</th><th>備註</th></tr></thead>
          <tbody>${futRows}</tbody>
        </table>
      </div>
    </div>
  `;
}

function switchTab(btn, name) {
  document.querySelectorAll('.chart-panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('tab-' + name).classList.add('active');
  btn.classList.add('active');
}

loadData();
setInterval(loadData, 60000);
loadWatchlist();

async function loadWatchlist() {
  try {
    const res = await fetch(`${RAW}/watchlist.json?t=${Date.now()}`);
    const wl = await res.json();
    renderWatchlist(wl);
  } catch(e) {
    document.getElementById('watchlist-body').innerHTML =
      `<div style="color:var(--muted);font-size:13px">⚠ 選股資料載入失敗</div>`;
  }
}

function renderWatchlist(wl) {
  const body = document.getElementById('watchlist-body');
  const dateEl = document.getElementById('screen-date');
  const cands = wl.candidates || [];

  dateEl.textContent = wl.last_screened !== '尚未執行'
    ? `上次篩選：${wl.last_screened}　共篩選 ${wl.total_screened} 支`
    : '首次篩選將於本週日自動執行';

  if (!cands.length) {
    body.innerHTML = `
      <div style="text-align:center;padding:32px;color:var(--muted)">
        <div style="font-size:32px;margin-bottom:12px">🔍</div>
        <div style="font-size:14px">選股雷達尚未執行</div>
        <div style="font-size:12px;margin-top:8px">每週日自動掃描全市場，首次結果即將產生</div>
        <div style="font-size:11px;margin-top:12px;color:#4a5568">
          篩選條件：PE 0–30 · PB ≤ 5 · 殖利率 ≥ 1%<br>技術指標：RSI · KD · MA20 · MACD 綜合評分
        </div>
      </div>`;
    return;
  }

  function scoreColor(s) {
    if (s >= 80) return '#48bb78';
    if (s >= 60) return '#f6c90e';
    return '#fc8181';
  }

  const rows = cands.map((c, i) => {
    const rank = i < 3 ? `<span class="rank-badge rank-${i+1}">${i+1}</span>` : `<span class="rank-badge">${i+1}</span>`;
    const sc = scoreColor(c.score);
    const scoreBar = `<div class="score-bar">
      <span class="score-num" style="color:${sc}">${c.score}</span>
      <div style="flex:1;background:var(--border);border-radius:3px;height:6px">
        <div class="score-fill" style="width:${c.score}%;background:${sc}"></div>
      </div>
    </div>`;
    const sigs = (c.signals || []).slice(0, 3).map(s => `<span class="signal-tag">${s}</span>`).join('');
    const rsiColor = c.rsi ? (c.rsi < 30 ? 'red' : c.rsi > 70 ? 'red' : c.rsi >= 40 && c.rsi <= 60 ? 'green' : '') : '';
    const kdColor  = c.k && c.d ? (c.k > c.d ? 'green' : 'red') : '';
    const maColor  = c.price && c.ma20 ? (c.price > c.ma20 ? 'green' : 'red') : '';
    return `<tr>
      <td>${rank}</td>
      <td><div style="font-weight:700">${c.code}</div><div style="font-size:11px;color:var(--muted)">${c.name}</div></td>
      <td>$${c.price ? fmt(c.price) : '—'}</td>
      <td>${scoreBar}</td>
      <td><span class="${rsiColor}">${c.rsi || '—'}</span></td>
      <td><span class="${kdColor}">${c.k ? `${c.k}/${c.d}` : '—'}</span></td>
      <td><span class="${maColor}">${c.ma20 ? '$'+fmt(c.ma20) : '—'}</span></td>
      <td>${c.pe}</td>
      <td>${c.dividend_yield}%</td>
      <td>${sigs}</td>
    </tr>`;
  }).join('');

  body.innerHTML = `
    <div class="screen-meta">
      <span>🔬 篩選範圍：${wl.total_screened} 支上市股</span>
      <span>📐 ${wl.criteria?.fundamental || ''}</span>
    </div>
    <div style="overflow-x:auto">
      <table class="wl-table">
        <thead><tr>
          <th>#</th><th>股票</th><th>股價</th><th>評分</th>
          <th>RSI</th><th>KD</th><th>MA20</th>
          <th>PE</th><th>殖利率</th><th>技術信號</th>
        </tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>`;
}
</script>

<script>
// ── 個股 K 線圖（lightweight-charts + GitHub raw data）─────────────────────
const PRICE_BASE = 'https://raw.githubusercontent.com/foreveris524-dev/tw-stock-sim/main/price_data/';
const STOCK_LIST = [
  { code: '0050',   name: '元大台灣50' },
  { code: '2330',   name: '台積電' },
  { code: '00981A', name: '統一主動台股增長' },
  { code: 'taiex',  name: '台灣加權指數' },
];

function createStockChart(containerId, ohlcData) {
  const el = document.getElementById(containerId);
  if (!el || !window.LightweightCharts) return;
  el.innerHTML = '';

  const chart = LightweightCharts.createChart(el, {
    width:  el.clientWidth,
    height: el.clientHeight,
    layout: {
      background: { type: 'solid', color: 'transparent' },
      textColor: '#718096',
      fontSize: 10,
    },
    grid: {
      vertLines: { color: '#2a2d3a' },
      horzLines: { color: '#2a2d3a' },
    },
    rightPriceScale: {
      borderColor: '#2a2d3a',
      scaleMargins: { top: 0.08, bottom: 0.08 },
    },
    timeScale: { borderColor: '#2a2d3a', timeVisible: false },
    crosshair: { mode: 1 },
    handleScroll: false,
    handleScale: false,
  });

  const series = chart.addCandlestickSeries({
    upColor:       '#10B981',
    downColor:     '#EF4444',
    borderVisible: false,
    wickUpColor:   '#10B981',
    wickDownColor: '#EF4444',
  });
  series.setData(ohlcData);
  chart.timeScale().fitContent();

  // 響應式 resize
  new ResizeObserver(() => {
    chart.applyOptions({ width: el.clientWidth });
  }).observe(el);
}

let stockChartsLoaded = false;

async function loadStockCharts() {
  if (stockChartsLoaded) return;
  for (const s of STOCK_LIST) {
    const el = document.getElementById('chart-' + s.code);
    if (!el) continue;
    el.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100%;color:#718096;font-size:11px">載入中...</div>';
    try {
      const resp = await fetch(PRICE_BASE + s.code + '.json?v=' + Date.now());
      if (!resp.ok) throw new Error(resp.status);
      const data = await resp.json();
      createStockChart('chart-' + s.code, data.ohlc);
    } catch(e) {
      if (el) el.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100%;color:#718096;font-size:11px">暫無資料</div>';
    }
  }
  stockChartsLoaded = true;
}

// 切換到個股走勢 tab 時才載入（lazy load）
const origSwitchTab = window.switchTab;
window.switchTab = function(btn, id) {
  if (origSwitchTab) origSwitchTab(btn, id);
  if (id === 'stocks') loadStockCharts();
};

// ── Binance Bot ──
async function loadBinance() {
  try {
    const res = await fetch(`${RAW}/binance_status.json?t=${Date.now()}`);
    if (!res.ok) throw new Error(res.status);
    const d = await res.json();
    renderBinance(d);
    document.getElementById('binance-updated').textContent = `　更新 ${d.last_updated || '—'}`;
  } catch(e) {
    document.getElementById('binance-body').innerHTML =
      `<div style="color:var(--muted);font-size:13px">⚠ 尚無資料（Bot 尚未推送）</div>`;
  }
}

function renderBinance(d) {
  const modes = [
    { key: 'fast',  label: '快速模式', sub: '1m K棒 · MA5/MA20' },
    { key: 'trend', label: '趨勢模式', sub: '1h K棒 · MA9/MA21 · 停損-2%' },
  ];

  const cards = modes.map(m => {
    const b = d[m.key] || {};
    const sig = b.signal || '—';
    const sigColor = sig === 'BUY' ? 'var(--green)' : sig === 'SELL' ? 'var(--red)' : 'var(--muted)';
    const pos = b.position || null;
    const posBadge = pos
      ? `<span style="background:var(--green);color:#000;font-size:11px;padding:2px 8px;border-radius:4px;font-weight:600">持多</span>`
      : `<span style="background:var(--border);color:var(--muted);font-size:11px;padding:2px 8px;border-radius:4px">無持倉</span>`;
    const ep = b.entry_price ? `進場 $${Number(b.entry_price).toLocaleString()}` : '';

    // 累積損益（加總所有 SELL 的 pnl）
    const allTrades = b.trades || [];
    const cumPnl = allTrades.reduce((sum, t) => sum + (t.pnl != null ? Number(t.pnl) : 0), 0);
    const cumPnlFixed = cumPnl.toFixed(4);
    const cumColor = cumPnl > 0 ? 'var(--green)' : cumPnl < 0 ? 'var(--red)' : 'var(--muted)';
    const cumText = allTrades.some(t => t.pnl != null)
      ? `<span style="color:${cumColor};font-weight:700">${cumPnl >= 0 ? '+' : ''}${cumPnlFixed} USDT</span>`
      : `<span style="color:var(--muted)">尚無已結算損益</span>`;

    const trades = allTrades.slice().reverse().slice(0, 5);
    const tradeRows = trades.map(t => {
      const pnl = t.pnl != null ? `<span class="${t.pnl >= 0 ? 'green' : 'red'}">${t.pnl >= 0 ? '+' : ''}${t.pnl} USDT</span>` : '—';
      const sideColor = t.side === 'BUY' ? 'var(--green)' : 'var(--red)';
      return `<tr>
        <td style="color:var(--muted);font-size:11px">${t.time||''}</td>
        <td><span style="color:${sideColor};font-weight:600">${t.side}</span></td>
        <td>$${Number(t.price||0).toLocaleString()}</td>
        <td>${pnl}</td>
        <td style="color:var(--muted);font-size:11px">${t.reason||'均線'}</td>
      </tr>`;
    }).join('') || `<tr><td colspan="5" class="empty">尚無交易記錄</td></tr>`;

    return `
      <div class="card" style="flex:1;min-width:280px">
        <div class="card-header">${m.label} <span style="font-size:11px;font-weight:400;color:var(--muted)">${m.sub}</span></div>
        <div class="card-body">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
            <div>
              <div style="font-size:22px;font-weight:700">$${b.price ? Number(b.price).toLocaleString() : '—'}</div>
              <div style="font-size:11px;color:var(--muted);margin-top:2px">BTCUSDT ${ep}</div>
            </div>
            <div style="text-align:right">
              <div style="font-size:20px;font-weight:700;color:${sigColor}">${sig}</div>
              <div style="margin-top:4px">${posBadge}</div>
            </div>
          </div>
          <div style="display:flex;justify-content:space-between;align-items:center;background:var(--bg);border-radius:8px;padding:10px 14px;margin-bottom:14px">
            <div style="font-size:12px;color:var(--muted)">累積損益</div>
            <div style="font-size:15px">${cumText}</div>
          </div>
          <div style="font-size:12px;color:var(--muted);margin-bottom:6px">最近交易（最多顯示 5 筆）</div>
          <div style="overflow-x:auto">
            <table class="log-table">
              <thead><tr><th>時間</th><th>方向</th><th>價格</th><th>損益</th><th>原因</th></tr></thead>
              <tbody>${tradeRows}</tbody>
            </table>
          </div>
        </div>
      </div>`;
  }).join('');

  document.getElementById('binance-body').innerHTML =
    `<div style="display:flex;gap:16px;flex-wrap:wrap">${cards}</div>`;
}

loadBinance();
setInterval(loadBinance, 60000);
</script>
</body>
</html>
