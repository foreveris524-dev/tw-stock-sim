<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>台股模擬操盤儀表板</title>
<style>
  :root {
    --bg: #0f1117;
    --card: #1a1d27;
    --border: #2a2d3a;
    --text: #e2e8f0;
    --muted: #718096;
    --green: #48bb78;
    --red: #fc8181;
    --blue: #63b3ed;
    --gold: #f6c90e;
    --radius: 12px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: -apple-system, 'Segoe UI', sans-serif; min-height: 100vh; }

  header {
    background: var(--card);
    border-bottom: 1px solid var(--border);
    padding: 16px 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  header h1 { font-size: 18px; font-weight: 600; color: var(--gold); letter-spacing: 0.5px; }
  .last-updated { font-size: 12px; color: var(--muted); }
  .refresh-btn {
    background: var(--border);
    border: none;
    color: var(--text);
    padding: 6px 14px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
  }
  .refresh-btn:hover { background: #3a3d4a; }

  .outer { max-width: 1100px; margin: 0 auto; padding: 24px 20px; }

  /* ── Charts ── */
  .charts-tabs { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
  .tab-btn {
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 7px 18px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 500;
    transition: all 0.15s;
  }
  .tab-btn.active { background: var(--border); color: var(--text); border-color: #4a4d5a; }
  .tab-btn:hover:not(.active) { color: var(--text); }
  .chart-panel { display: none; }
  .chart-panel.active { display: block; }
  .chart-wrap {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    height: 420px;
    margin-bottom: 24px;
  }
  .chart-wrap iframe { width: 100%; height: 100%; border: none; display: block; }
  .watchlist-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 14px;
    margin-bottom: 24px;
  }
  .mini-label { font-size: 11px; color: var(--muted); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.8px; }
  .mini-chart-wrap {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    height: 140px;
  }
  .mini-chart-wrap iframe { width: 100%; height: 100%; border: none; display: block; }

  /* ── Stats ── */
  .stats-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 14px;
    margin-bottom: 24px;
  }
  .stat-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px 20px;
  }
  .stat-label { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); margin-bottom: 8px; }
  .stat-value { font-size: 22px; font-weight: 700; }
  .stat-sub { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .green { color: var(--green); }
  .red { color: var(--red); }
  .blue { color: var(--blue); }
  .gold { color: var(--gold); }

  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 24px; }
  @media (max-width: 700px) { .grid-2 { grid-template-columns: 1fr; } }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
  }
  .card-header {
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    font-size: 13px;
    font-weight: 600;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.8px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .card-body { padding: 18px 20px; }

  .holding-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
  }
  .holding-row:last-child { border-bottom: none; }
  .holding-code { font-weight: 700; font-size: 15px; }
  .holding-name { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .holding-right { text-align: right; }
  .holding-value { font-size: 14px; font-weight: 600; }
  .holding-pnl { font-size: 12px; margin-top: 3px; }

  .futures-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .fut-key { font-size: 11px; color: var(--muted); margin-bottom: 4px; }
  .fut-val { font-size: 15px; font-weight: 600; }

  .position-badge {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 700;
  }
  .badge-short { background: rgba(252,129,129,0.15); color: var(--red); border: 1px solid rgba(252,129,129,0.3); }
  .badge-long  { background: rgba(72,187,120,0.15);  color: var(--green); border: 1px solid rgba(72,187,120,0.3); }
  .badge-none  { background: rgba(113,128,150,0.15); color: var(--muted); border: 1px solid rgba(113,128,150,0.3); }

  .log-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .log-table th { text-align: left; padding: 8px 12px; color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.8px; border-bottom: 1px solid var(--border); }
  .log-table td { padding: 10px 12px; border-bottom: 1px solid rgba(42,45,58,0.6); }
  .log-table tr:last-child td { border-bottom: none; }
  .log-table tr:hover td { background: rgba(255,255,255,0.02); }

  .action-tag { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; }
  .tag-buy   { background: rgba(72,187,120,0.15);  color: var(--green); }
  .tag-sell  { background: rgba(252,129,129,0.15); color: var(--red); }
  .tag-short { background: rgba(252,129,129,0.15); color: var(--red); }
  .tag-cover { background: rgba(72,187,120,0.15);  color: var(--green); }
  .tag-plan  { background: rgba(99,179,237,0.15);  color: var(--blue); }
  .tag-other { background: rgba(113,128,150,0.15); color: var(--muted); }

  .empty { color: var(--muted); font-size: 13px; text-align: center; padding: 24px; }
  .progress-bar { background: var(--border); border-radius: 4px; height: 6px; margin-top: 8px; overflow: hidden; }
  .progress-fill { height: 100%; border-radius: 4px; transition: width 0.3s; }
  .loading { text-align: center; padding: 60px; color: var(--muted); }
  .card-mb { margin-bottom: 20px; }
</style>
</head>
<body>

<header>
  <h1>📊 台股模擬操盤</h1>
  <div style="display:flex;align-items:center;gap:16px">
    <span class="last-updated" id="last-updated">載入中...</span>
    <button class="refresh-btn" onclick="loadData()">↻ 更新</button>
  </div>
</header>

<div class="outer">

  <!-- 走勢圖 -->
  <div class="charts-tabs">
    <button class="tab-btn active" onclick="switchTab(this,'taiex')">台灣加權指數</button>
    <button class="tab-btn" onclick="switchTab(this,'futures')">台指期（近月）</button>
    <button class="tab-btn" onclick="switchTab(this,'stocks')">個股走勢</button>
  </div>

  <div id="tab-taiex" class="chart-panel active">
    <div class="chart-wrap">
      <iframe src="https://s3.tradingview.com/widgetembed/?symbol=TVC%3ATWII&interval=D&theme=dark&locale=zh_TW&timezone=Asia%2FTaipei&style=1&hidesidetoolbar=0&hidetoptoolbar=0&saveimage=0" allowtransparency="true" scrolling="no" allowfullscreen></iframe>
    </div>
  </div>

  <div id="tab-futures" class="chart-panel">
    <div class="chart-wrap">
      <iframe src="https://s3.tradingview.com/widgetembed/?symbol=TAIFEX%3ATX1!&interval=D&theme=dark&locale=zh_TW&timezone=Asia%2FTaipei&style=1&hidesidetoolbar=0&hidetoptoolbar=0&saveimage=0" allowtransparency="true" scrolling="no" allowfullscreen></iframe>
    </div>
  </div>

  <div id="tab-stocks" class="chart-panel">
    <div class="watchlist-grid">
      <div>
        <div class="mini-label">0050 元大台灣50</div>
        <div class="mini-chart-wrap">
          <iframe src="https://s3.tradingview.com/widgetembed/?symbol=TWSE%3A0050&interval=D&theme=dark&locale=zh_TW&timezone=Asia%2FTaipei&style=1&hidesidetoolbar=1&hidetoptoolbar=1&saveimage=0" allowtransparency="true" scrolling="no"></iframe>
        </div>
      </div>
      <div>
        <div class="mini-label">2330 台積電</div>
        <div class="mini-chart-wrap">
          <iframe src="https://s3.tradingview.com/widgetembed/?symbol=TWSE%3A2330&interval=D&theme=dark&locale=zh_TW&timezone=Asia%2FTaipei&style=1&hidesidetoolbar=1&hidetoptoolbar=1&saveimage=0" allowtransparency="true" scrolling="no"></iframe>
        </div>
      </div>
      <div>
        <div class="mini-label">小台指（MTX）</div>
        <div class="mini-chart-wrap">
          <iframe src="https://s3.tradingview.com/widgetembed/?symbol=TAIFEX%3AMTX1!&interval=D&theme=dark&locale=zh_TW&timezone=Asia%2FTaipei&style=1&hidesidetoolbar=1&hidetoptoolbar=1&saveimage=0" allowtransparency="true" scrolling="no"></iframe>
        </div>
      </div>
      <div>
        <div class="mini-label">00981A 統一主動台股</div>
        <div class="mini-chart-wrap">
          <iframe src="https://s3.tradingview.com/widgetembed/?symbol=TWSE%3A00981A&interval=D&theme=dark&locale=zh_TW&timezone=Asia%2FTaipei&style=1&hidesidetoolbar=1&hidetoptoolbar=1&saveimage=0" allowtransparency="true" scrolling="no"></iframe>
        </div>
      </div>
    </div>
  </div>

  <!-- 帳戶數據 -->
  <div id="app"><div class="loading">載入資料中...</div></div>

</div>

<script>
const REPO = 'foreveris524-dev/tw-stock-sim';
const RAW = `https://raw.githubusercontent.com/${REPO}/main`;

function fmt(n) { return Number(n).toLocaleString('zh-TW', {maximumFractionDigits:0}); }
function fmtMoney(n) { return (n >= 0 ? '+' : '') + '$' + fmt(n); }
function colorClass(n) { return n > 0 ? 'green' : n < 0 ? 'red' : ''; }
function actionTag(a) {
  a = a || '';
  const u = a.toUpperCase();
  if (u.includes('BUY'))   return `<span class="action-tag tag-buy">${a}</span>`;
  if (u.includes('SELL'))  return `<span class="action-tag tag-sell">${a}</span>`;
  if (u.includes('SHORT')) return `<span class="action-tag tag-short">${a}</span>`;
  if (u.includes('COVER')) return `<span class="action-tag tag-cover">${a}</span>`;
  if (u.includes('PLAN'))  return `<span class="action-tag tag-plan">${a}</span>`;
  return `<span class="action-tag tag-other">${a}</span>`;
}

async function loadData() {
  try {
    const [pRes, fRes] = await Promise.all([
      fetch(`${RAW}/portfolio.json?t=${Date.now()}`),
      fetch(`${RAW}/futures_portfolio.json?t=${Date.now()}`)
    ]);
    render(await pRes.json(), await fRes.json());
    document.getElementById('last-updated').textContent = '更新於 ' + new Date().toLocaleTimeString('zh-TW');
  } catch(e) {
    document.getElementById('app').innerHTML = `<div style="color:var(--red);padding:20px">⚠ 載入失敗：${e.message}</div>`;
  }
}

function render(p, f) {
  const cash = p.cash || 0, tv = p.total_value || 0, ic = p.initial_capital || 1000000;
  const holdings = p.holdings || [];
  const im = f.initial_margin || 200000, cp = f.cumulative_pnl || 0;
  const um = f.used_margin || 0, am = f.available_margin || im;
  const pos = f.position, spnl = tv - ic, tpnl = spnl + cp;
  const mpct = im ? um / im * 100 : 0;
  const tradeLog = [...(p.trade_log||[])].reverse().slice(0,20);
  const futLog   = [...(f.trade_log||[])].reverse().slice(0,10);

  let posBadge = '<span class="position-badge badge-none">無持倉</span>';
  let posDetail = '';
  if (pos) {
    const isLong = pos.direction === 'LONG';
    posBadge = `<span class="position-badge ${isLong?'badge-long':'badge-short'}">${isLong?'LONG 多':'SHORT 空'}</span>`;
    const up = pos.unrealized_pnl || 0;
    posDetail = `${pos.contracts}口 @ ${(pos.entry_price||0).toLocaleString()}點`;
    if (up) posDetail += `　未實現 <span class="${colorClass(up)}">${fmtMoney(up)}</span>`;
  }

  const holdHtml = holdings.length ? holdings.map(h => {
    const pct = tv ? (h.value||0)/tv*100 : 0, up = h.unrealized_pnl||0, uc = h.unrealized_pnl_pct||0;
    return `<div class="holding-row">
      <div><div class="holding-code">${h.code} <small style="font-weight:400;color:var(--muted)">${h.name||''}</small></div>
      <div class="holding-name">均價$${(h.avg_price||0).toFixed(1)} · ${(h.shares||0).toLocaleString()}股 · ${pct.toFixed(1)}%</div></div>
      <div class="holding-right"><div class="holding-value">$${fmt(h.value||0)}</div>
      <div class="holding-pnl ${colorClass(up)}">${fmtMoney(up)} (${up>=0?'+':''}${uc.toFixed(1)}%)</div></div>
    </div>`;
  }).join('') : '<div class="empty">目前無持股</div>';

  const logRows = tradeLog.filter(t => t.action !== 'RESET').map(t =>
    `<tr><td>${t.date||''}</td><td>${actionTag(t.action)}</td><td>${t.code||'—'}</td>
    <td>${t.price?'$'+fmt(t.price):'—'}</td><td>${t.shares?fmt(t.shares):'—'}</td>
    <td>${t.amount?'$'+fmt(t.amount):'—'}</td>
    <td style="color:var(--muted);font-size:12px;max-width:180px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis">${t.reason||''}</td></tr>`
  ).join('') || '<tr><td colspan="7" class="empty">無記錄</td></tr>';

  const futRows = futLog.filter(t => t.action !== 'RESET').map(t => {
    const pnl = t.pnl || 0;
    return `<tr><td>${t.date||''}</td><td>${actionTag(t.action)}</td><td>${t.direction||'—'}</td>
    <td>${t.contracts||'—'}</td><td>${t.entry_price?(t.entry_price).toLocaleString():'—'}</td>
    <td class="${colorClass(pnl)}">${pnl?fmtMoney(pnl):'—'}</td>
    <td style="color:var(--muted);font-size:12px;max-width:160px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis">${t.reason||''}</td></tr>`;
  }).join('') || '<tr><td colspan="7" class="empty">無記錄</td></tr>';

  const mColor = mpct > 70 ? '#fc8181' : mpct > 40 ? '#f6c90e' : '#48bb78';

  document.getElementById('app').innerHTML = `
    <div class="stats-grid">
      <div class="stat-card"><div class="stat-label">現貨總值</div>
        <div class="stat-value">$${fmt(tv)}</div><div class="stat-sub ${colorClass(spnl)}">${fmtMoney(spnl)} 相較起始</div></div>
      <div class="stat-card"><div class="stat-label">可用現金</div>
        <div class="stat-value blue">$${fmt(cash)}</div><div class="stat-sub">${tv?(cash/tv*100).toFixed(0):0}% 現金比</div></div>
      <div class="stat-card"><div class="stat-label">期貨累計損益</div>
        <div class="stat-value ${colorClass(cp)}">${fmtMoney(cp)}</div><div class="stat-sub">保證金 $${fmt(am)}</div></div>
      <div class="stat-card"><div class="stat-label">整體損益合計</div>
        <div class="stat-value ${colorClass(tpnl)}">${fmtMoney(tpnl)}</div><div class="stat-sub">更新 ${p.last_updated||'—'}</div></div>
    </div>

    <div class="grid-2">
      <div class="card"><div class="card-header">現貨持股</div><div class="card-body">${holdHtml}</div></div>
      <div class="card"><div class="card-header">期貨帳戶 <span>${posBadge}</span></div>
        <div class="card-body">
          ${posDetail?`<div style="margin-bottom:16px;font-size:14px">${posDetail}</div>`:''}
          <div class="futures-grid">
            <div><div class="fut-key">商品</div><div class="fut-val">${f.instrument||'小台指 MTX'}</div></div>
            <div><div class="fut-key">點值</div><div class="fut-val">$${f.point_value||50}/點</div></div>
            <div><div class="fut-key">初始保證金</div><div class="fut-val">$${fmt(im)}</div></div>
            <div><div class="fut-key">已用保證金</div><div class="fut-val ${um?'gold':''}">$${fmt(um)}</div></div>
          </div>
          <div style="margin-top:16px">
            <div style="display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:4px">
              <span>保證金使用率</span><span>${mpct.toFixed(0)}%</span></div>
            <div class="progress-bar"><div class="progress-fill" style="width:${Math.min(mpct,100)}%;background:${mColor}"></div></div>
          </div>
        </div>
      </div>
    </div>

    <div class="card card-mb">
      <div class="card-header">現貨交易記錄（最近 20 筆）</div>
      <div style="overflow-x:auto">
        <table class="log-table">
          <thead><tr><th>日期</th><th>動作</th><th>代號</th><th>價格</th><th>股數</th><th>金額</th><th>備註</th></tr></thead>
          <tbody>${logRows}</tbody>
        </table>
      </div>
    </div>

    <div class="card">
      <div class="card-header">期貨操作記錄（最近 10 筆）</div>
      <div style="overflow-x:auto">
        <table class="log-table">
          <thead><tr><th>日期</th><th>動作</th><th>方向</th><th>口數</th><th>進場點</th><th>損益</th><th>備註</th></tr></thead>
          <tbody>${futRows}</tbody>
        </table>
      </div>
    </div>
  `;
}

function switchTab(btn, name) {
  document.querySelectorAll('.chart-panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('tab-' + name).classList.add('active');
  btn.classList.add('active');
}

loadData();
setInterval(loadData, 60000);
</script>
</body>
</html>
