name: 台指期夜盤模擬

on:
  schedule:
    - cron: "*/15 7-21 * * 1-5"   # 每15分鐘，週一到週五，UTC 07:00-21:45 = 台北 15:00-05:45
  workflow_dispatch:

jobs:
  night-trade:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Run night trade
        run: python3 scripts/night_trade.py

      - name: Commit portfolio
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add futures_portfolio.json
          git diff --cached --quiet || git commit -m "夜盤交易 $(date +'%Y-%m-%d %H:%M') UTC"
          git push
