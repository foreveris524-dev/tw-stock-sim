name: 台指期夜盤模擬

on:
  schedule:
    - cron: "2,17,32,47 7-21 * * 1-5"   # 每15分鐘（錯開整點），週一到週五，UTC 07:02-21:47 = 台北 15:02-05:47
  workflow_dispatch:

jobs:
  night-trade:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Run night trade
        run: python3 scripts/night_trade.py

      - name: Commit portfolio
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          cp futures_portfolio.json /tmp/fp_new.json
          for i in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/fp_new.json futures_portfolio.json
            git add futures_portfolio.json
            git diff --cached --quiet && break
            git commit -m "夜盤交易 $(date +'%Y-%m-%d %H:%M') UTC"
            git push && break
            sleep 5
          done
