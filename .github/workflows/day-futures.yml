name: 台指期日盤模擬

on:
  schedule:
    - cron: "2,17,32,47 1-5 * * 1-5"   # 每15分鐘（錯開整點），週一到週五，UTC 01:02-05:47 = 台北 09:02-13:47
  workflow_dispatch:

jobs:
  day-futures:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Run day futures trade
        run: python3 scripts/night_trade.py

      - name: Commit portfolio
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add futures_portfolio.json
          git diff --cached --quiet || git commit -m "日盤期貨 $(date +'%Y-%m-%d %H:%M') UTC"
          git pull --rebase origin main
          git push
